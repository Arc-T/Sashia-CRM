# ===== خطاهای API (کلیدها در ErrorCode تعریف شده‌اند) =====
error.validation=اطلاعات ارسال‌شده نامعتبر است. لطفاً خطاهای فرم را بررسی کنید.
error.malformed=ساختار درخواست نامعتبر است یا مقدار یکی از فیلدها قابل پذیرش نیست.
error.invalidParameter=پارامتر «{0}» نامعتبر است.
error.unauthorized=برای دسترسی باید وارد حساب کاربری شوید یا نشست شما منقضی شده است.
error.invalidCredentials=نام کاربری یا رمز عبور اشتباه است.
error.accountDisabled=حساب کاربری شما غیرفعال است. با مدیر سیستم تماس بگیرید.
error.accessDenied=شما اجازهٔ انجام این عملیات را ندارید.
error.notFound={0} با شناسهٔ {1} یافت نشد.
error.routeNotFound=مسیر درخواستی وجود ندارد.
error.methodNotAllowed=این روش درخواست برای این مسیر مجاز نیست.
error.notAcceptable=قالب پاسخ درخواستی پشتیبانی نمی‌شود.
error.unsupportedMediaType=نوع محتوای ارسالی پشتیبانی نمی‌شود؛ از application/json استفاده کنید.
error.duplicate=مقدار «{1}» برای «{0}» قبلاً ثبت شده است.
error.referenceInUse=این رکورد در بخش‌های دیگر استفاده شده و قابل حذف نیست.
error.dataIntegrity=عملیات به‌دلیل نقض یکپارچگی داده‌ها انجام نشد.
error.concurrentModification=این رکورد هم‌زمان توسط کاربر دیگری تغییر کرده است. صفحه را بازخوانی و دوباره تلاش کنید.
error.invalidReference=رکورد انتخاب‌شده برای «{0}» (شناسه {1}) وجود ندارد.
error.businessRule=عملیات مجاز نیست.
error.generic=درخواست با خطا مواجه شد.
error.internal=خطای داخلی سرور رخ داد. در صورت تکرار، کد پیگیری {0} را به پشتیبانی اعلام کنید.

