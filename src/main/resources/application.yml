spring:
  application.name: crm-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/crm?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:crm}
    password: ${DB_PASSWORD:crm}
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate          # schema is owned by Flyway; Hibernate only validates it
    properties.hibernate:
      jdbc.time_zone: UTC
      jdbc.batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  messages:
    basename: messages,messages-fields,messages-enums
    encoding: UTF-8
    fallback-to-system-locale: false      # always Persian, whatever Accept-Language says
  web:
    locale: fa-IR
    locale-resolver: fixed
  modulith:
    events:
      jdbc.schema-initialization.enabled: true
      republish-outstanding-events-on-restart: true

server:
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints.web.exposure.include: health,info,modulith
  endpoint.health.probes.enabled: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}              # >= 32 bytes; required (see application-dev.yml for a dev value)
      expiration: PT8H
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}   # when set and no users exist, creates user "admin"

springdoc:
  swagger-ui.path: /swagger-ui.html
